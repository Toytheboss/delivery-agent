<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delivery Dashboard · 管理员登录</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ecfdf5; color: #064e3b; }
    main { width: min(360px, calc(100vw - 40px)); padding: 28px; border: 1px solid #a7f3d0; border-radius: 12px; background: #fff; box-shadow: 0 16px 40px rgb(6 78 59 / 12%); }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 22px; color: #047857; font-size: 14px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 600; }
    input, button { box-sizing: border-box; width: 100%; min-height: 42px; border-radius: 8px; font: inherit; }
    input { padding: 9px 11px; border: 1px solid #a7f3d0; }
    button { margin-top: 20px; border: 0; color: #fff; background: #059669; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .error { min-height: 20px; margin-top: 12px; color: #b91c1c; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Delivery Dashboard</h1>
    <p>管理员登录</p>
    <form id="login-form">
      <label for="username">登录名</label>
      <input id="username" name="username" autocomplete="username" required />
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button id="submit" type="submit">登录</button>
      <div class="error" id="error" role="alert"></div>
    </form>
  </main>
  <script>
    const base = location.pathname.replace(/\/login\/?$/, "") || "/dashboard";
    const form = document.getElementById("login-form");
    const button = document.getElementById("submit");
    const error = document.getElementById("error");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      error.textContent = "";
      try {
        const res = await fetch(`${base}/api/login`, {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "登录失败");
        location.href = base;
      } catch (e) {
        error.textContent = e.message || "登录失败";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
