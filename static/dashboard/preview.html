<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Botchain Delivery · 数据看板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>:root {
  --bg: #ecfdf5;
  --surface: #ffffff;
  --surface-2: #d1fae5;
  --text: #064e3b;
  --muted: #047857;
  --primary: #059669;
  --primary-2: #10b981;
  --mint: #79ffb8;
  --warn: #fbbf24;
  --danger: #dc2626;
  --border: #a7f3d0;
  --shadow: 0 8px 24px rgba(6, 78, 59, 0.08);
  --radius: 14px;
  --font: "Fira Sans", system-ui, sans-serif;
  --mono: "Fira Code", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background:
    radial-gradient(900px 420px at 10% -10%, rgba(121, 255, 184, 0.35), transparent 60%),
    radial-gradient(700px 380px at 100% 0%, rgba(16, 185, 129, 0.18), transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: var(--font);
}

a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 18px 48px; }

.top {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.brand {
  display: flex;
  gap: 12px;
  align-items: center;
}
.brand img {
  width: 36px;
  height: 36px;
  object-fit: contain;
}
.brand h1 {
  margin: 0;
  font-size: 1.25rem;
  font-weight: 650;
  letter-spacing: -0.02em;
}
.brand p {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 0.85rem;
}

.nav, .toggle {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.nav a, .toggle button, button.btn, .field button {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: 999px;
  padding: 8px 14px;
  font: inherit;
  font-weight: 560;
  cursor: pointer;
  transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
}
.nav a.active, .toggle button.active, button.btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.nav a:hover, .toggle button:hover, button.btn:hover, .field button:hover {
  border-color: var(--primary-2);
  background: var(--surface-2);
}
.nav a.active:hover, .toggle button.active:hover, button.btn.primary:hover {
  background: #047857;
  color: #fff;
}
button.btn:focus-visible, .toggle button:focus-visible, .nav a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid var(--mint);
  outline-offset: 2px;
}

.meta {
  color: var(--muted);
  font-size: 0.85rem;
  font-family: var(--mono);
  margin-bottom: 14px;
}

.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  box-shadow: var(--shadow);
}
.kpi .label { color: var(--muted); font-size: 0.78rem; }
.kpi .value {
  margin-top: 4px;
  font-size: 1.45rem;
  font-weight: 700;
  font-family: var(--mono);
  letter-spacing: -0.03em;
}

.grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
@media (max-width: 900px) {
  .grid { grid-template-columns: 1fr; }
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}
.panel h2 {
  margin: 0 0 10px;
  font-size: 1rem;
  font-weight: 650;
}
  .panel .chart {
    width: 100%;
    height: 280px;
  }
  .panel .chart.calendar {
    height: 220px;
  }
  .panel canvas { max-height: 260px; }

  .day-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
  }
  .day-bar input[type="date"] {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 12px;
    font: inherit;
    background: #fff;
    color: var(--text);
  }
  .day-hint {
    color: var(--muted);
    font-size: 0.82rem;
  }

.table-wrap { overflow: auto; max-height: 420px; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.86rem;
}
th, td {
  text-align: left;
  padding: 8px 8px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
td.mono { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
.q { max-width: 280px; }
.a { max-width: 340px; color: var(--muted); }

.hidden { display: none !important; }
.err {
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: var(--danger);
  padding: 12px 14px;
  border-radius: var(--radius);
  margin-bottom: 12px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
}
.field label { font-size: 0.82rem; font-weight: 600; }
.field .hint { font-size: 0.75rem; color: var(--muted); }
.field input[type="text"],
.field input[type="number"],
.field textarea,
.field select {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
  font: inherit;
  background: #fff;
  color: var(--text);
}
.field textarea { min-height: 72px; resize: vertical; }
.field.bool {
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
}
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
.learned-list { display: grid; gap: 8px; }
.learned-item {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  background: var(--surface);
}
.learned-item .name { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div>
          <h1>Botchain Delivery</h1>
          <p>原型预览 · 60天日历 · ECharts</p>
        </div>
      </div>
      <nav class="nav">
        <a class="active" href="#" id="link-data">数据</a>
        <a href="#" id="link-settings">设置</a>
      </nav>
      <div class="toggle" id="view-toggle">
        <button type="button" class="active" data-view="ops">运营</button>
        <button type="button" data-view="exec">管理层</button>
      </div>
    </header>

    <div id="err" class="err hidden"></div>
    <div class="meta" id="meta">加载中…</div>

    <section id="view-ops">
      <div class="kpis" id="ops-kpis"></div>

      <div class="panel" style="margin-bottom:16px">
        <h2>60 天日历复查</h2>
        <p class="day-hint">颜色=当日消息活跃度（回答+沉默）。点击格子或选日期，可复查该日问答与指标（日志保留窗口内）。</p>
        <div class="day-bar">
          <input type="date" id="day-picker" />
          <button type="button" class="btn primary" id="btn-day">复查当日</button>
          <button type="button" class="btn" id="btn-day-clear">回到总览列表</button>
          <span class="day-hint" id="day-status">未选择日期</span>
        </div>
        <div class="chart calendar" id="chartCalendar"></div>
      </div>

      <div class="kpis hidden" id="day-kpis"></div>

      <div class="grid">
        <div class="panel">
          <h2>近 14 日趋势（折线）</h2>
          <div class="chart" id="chartTrend"></div>
        </div>
        <div class="panel">
          <h2>沉默原因占比（环形）</h2>
          <div class="chart" id="chartSilence"></div>
        </div>
      </div>
      <div class="grid">
        <div class="panel">
          <h2>沉默原因排行（条形）</h2>
          <div class="chart" id="chartSilenceBar"></div>
        </div>
        <div class="panel">
          <h2>工作流日增量（面积）</h2>
          <div class="chart" id="chartWorkflowArea"></div>
        </div>
      </div>
      <div class="grid">
        <div class="panel">
          <h2>已回答（近期）</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>时间</th><th>群</th><th>问题</th><th>回答</th><th>原因</th></tr></thead>
              <tbody id="tbl-answered"></tbody>
            </table>
          </div>
        </div>
        <div class="panel">
          <h2>沉默（近期）</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>时间</th><th>群</th><th>问题</th><th>原因</th><th>分</th></tr></thead>
              <tbody id="tbl-silent"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <section id="view-exec" class="hidden">
      <div class="kpis" id="exec-kpis"></div>
      <div class="grid">
        <div class="panel">
          <h2>过去 24 小时 · 消息构成（柱状）</h2>
          <div class="chart" id="chartDailyMix"></div>
        </div>
        <div class="panel">
          <h2>存量摘要</h2>
          <div id="exec-stock" class="meta"></div>
        </div>
      </div>
    </section>
  </div>
  <script>
    document.getElementById("link-settings").href = "#";
    document.getElementById("link-data").href = "#";

    const GREEN = {
      primary: "#059669",
      mid: "#10b981",
      soft: "#34d399",
      mint: "#79ffb8",
      deep: "#047857",
      ink: "#064e3b",
      muted: "#047857",
      warn: "#fbbf24",
      danger: "#dc2626",
      palette: ["#059669", "#10b981", "#34d399", "#6ee7b7", "#a7f3d0", "#fbbf24", "#f59e0b", "#dc2626", "#047857", "#064e3b"],
    };

    const charts = {};
    let snapshotData = null;
    let selectedDay = null;
    let apiBase = "/dashboard";

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    function cTriple(counters, key) {
      const x = (counters || {})[key] || {};
      return { total: x.total || 0, week: x.week || 0, today: x.today || 0 };
    }

    function renderKpis(el, items) {
      el.innerHTML = items.map(([label, value]) =>
        `<div class="kpi"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div></div>`
      ).join("");
    }

    function daysFromSeries(series, key, n = 14) {
      const by = ((series || {})[key] || {}).by_day || {};
      const days = Object.keys(by).sort();
      return days.slice(-n);
    }

    function ensureChart(id) {
      const el = document.getElementById(id);
      if (!el) return null;
      if (charts[id]) return charts[id];
      charts[id] = echarts.init(el, null, { renderer: "canvas" });
      return charts[id];
    }

    function baseTextStyle() {
      return { color: GREEN.ink, fontFamily: "Fira Sans, system-ui, sans-serif" };
    }

    function renderTables(qa) {
      const ans = (qa.answered || []).slice(0, 80);
      const sil = (qa.silent || []).slice(0, 80);
      document.getElementById("tbl-answered").innerHTML = ans.map(r => `
        <tr>
          <td class="mono">${esc((r.ts || "").slice(5, 16))}</td>
          <td>${esc(r.chat_title)}</td>
          <td class="q">${esc(r.text)}</td>
          <td class="a">${esc(r.reply_text)}</td>
          <td class="mono">${esc(r.reason)}</td>
        </tr>`).join("") || `<tr><td colspan="5">暂无</td></tr>`;
      document.getElementById("tbl-silent").innerHTML = sil.map(r => `
        <tr>
          <td class="mono">${esc((r.ts || "").slice(5, 16))}</td>
          <td>${esc(r.chat_title)}</td>
          <td class="q">${esc(r.text)}</td>
          <td class="mono">${esc(r.reason)}</td>
          <td class="mono">${r.score ?? ""}</td>
        </tr>`).join("") || `<tr><td colspan="5">暂无</td></tr>`;
    }

    function buildCalendar(data) {
      const cal = data.calendar || {};
      const heat = cal.heat || [];
      const start = cal.start || heat[0]?.[0];
      const end = cal.end || heat[heat.length - 1]?.[0];
      if (!start || !end) return;

      const picker = document.getElementById("day-picker");
      picker.min = start;
      picker.max = end;
      if (!picker.value) picker.value = end;

      const chart = ensureChart("chartCalendar");
      if (!chart) return;
      chart.setOption({
        tooltip: {
          formatter(p) {
            const d = (p.data || [])[0];
            const v = (p.data || [])[1] || 0;
            const row = (cal.days || []).find(x => x.date === d) || {};
            return `${d}<br/>活跃 ${v}<br/>回答 ${row.replied || 0} · 沉默 ${row.silent || 0}<br/>FAQ ${row.faq_sessions || 0} · 处理 ${row.messages_processed || 0}`;
          },
        },
        visualMap: {
          min: 0,
          max: Math.max(1, ...heat.map(x => x[1] || 0)),
          orient: "horizontal",
          left: "center",
          bottom: 0,
          textStyle: { color: GREEN.muted },
          inRange: { color: ["#ecfdf5", "#a7f3d0", "#34d399", "#059669", "#064e3b"] },
        },
        calendar: {
          top: 28,
          left: 48,
          right: 16,
          bottom: 48,
          cellSize: ["auto", 18],
          range: [start, end],
          itemStyle: { borderWidth: 2, borderColor: "#fff" },
          splitLine: { lineStyle: { color: "#a7f3d0" } },
          dayLabel: { color: GREEN.muted, nameMap: "cn" },
          monthLabel: { color: GREEN.ink, nameMap: "cn" },
          yearLabel: { show: false },
        },
        series: [{
          type: "heatmap",
          coordinateSystem: "calendar",
          data: heat,
        }],
      }, true);

      chart.off("click");
      chart.on("click", (params) => {
        const day = Array.isArray(params.data) ? params.data[0] : null;
        if (day) {
          picker.value = day;
          loadDay(day);
        }
      });
    }

    function buildCharts(data) {
      const series = data.counters_series || {};
      const days = daysFromSeries(series, "messages_processed", 14);
      const labels = days.map(d => d.slice(5));
      const faq = days.map(d => (series.faq_reply_sessions?.by_day?.[d] || 0));
      const processed = days.map(d => (series.messages_processed?.by_day?.[d] || 0));
      const form = days.map(d => (series.form_dispatch_success?.by_day?.[d] || 0));
      const logo = days.map(d => (series.logo_fill_success?.by_day?.[d] || 0));
      const welcome = days.map(d => (series.welcome_sequences_started?.by_day?.[d] || 0));
      const markLive = days.map(d => (series.mark_live_triggers?.by_day?.[d] || 0));

      // 1) Multi-series smooth line — ops volume trends
      ensureChart("chartTrend")?.setOption({
        color: [GREEN.primary, GREEN.mid, GREEN.deep, GREEN.mint],
        textStyle: baseTextStyle(),
        tooltip: { trigger: "axis" },
        legend: { bottom: 0, textStyle: { color: GREEN.muted } },
        grid: { left: 40, right: 16, top: 24, bottom: 48 },
        xAxis: { type: "category", data: labels, boundaryGap: false, axisLabel: { color: GREEN.muted } },
        yAxis: { type: "value", minInterval: 1, splitLine: { lineStyle: { color: "#d1fae5" } }, axisLabel: { color: GREEN.muted } },
        series: [
          { name: "FAQ sessions", type: "line", smooth: true, showSymbol: false, data: faq },
          { name: "Processed", type: "line", smooth: true, showSymbol: false, data: processed },
          { name: "Form sent", type: "line", smooth: true, showSymbol: false, data: form },
          { name: "Logo ok", type: "line", smooth: true, showSymbol: false, data: logo },
        ],
      }, true);

      // 2) Doughnut — silence reason share
      const reasons = data.qa?.silence_reasons || {};
      const rEntries = Object.entries(reasons).sort((a, b) => b[1] - a[1]);
      ensureChart("chartSilence")?.setOption({
        color: GREEN.palette,
        textStyle: baseTextStyle(),
        tooltip: { trigger: "item", formatter: "{b}<br/>{c} ({d}%)" },
        legend: { type: "scroll", bottom: 0, textStyle: { color: GREEN.muted, fontSize: 11 } },
        series: [{
          type: "pie",
          radius: ["42%", "68%"],
          center: ["50%", "44%"],
          itemStyle: { borderRadius: 6, borderColor: "#fff", borderWidth: 2 },
          label: { color: GREEN.ink, formatter: "{d}%" },
          data: rEntries.map(([name, value]) => ({ name, value })),
        }],
      }, true);

      // 3) Horizontal bar — silence reason ranking (clearer for long labels)
      const topReasons = rEntries.slice(0, 8).reverse();
      ensureChart("chartSilenceBar")?.setOption({
        color: [GREEN.primary],
        textStyle: baseTextStyle(),
        tooltip: { trigger: "axis", axisPointer: { type: "shadow" } },
        grid: { left: 12, right: 24, top: 12, bottom: 12, containLabel: true },
        xAxis: { type: "value", minInterval: 1, splitLine: { lineStyle: { color: "#d1fae5" } }, axisLabel: { color: GREEN.muted } },
        yAxis: {
          type: "category",
          data: topReasons.map(([n]) => n.length > 28 ? n.slice(0, 26) + "…" : n),
          axisLabel: { color: GREEN.ink, fontSize: 11 },
        },
        series: [{
          type: "bar",
          data: topReasons.map(([, v]) => v),
          barWidth: 14,
          itemStyle: { borderRadius: [0, 8, 8, 0], color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
            { offset: 0, color: GREEN.deep },
            { offset: 1, color: GREEN.mint },
          ]) },
          label: { show: true, position: "right", color: GREEN.muted },
        }],
      }, true);

      // 4) Stacked area — workflow daily increments
      ensureChart("chartWorkflowArea")?.setOption({
        color: [GREEN.primary, GREEN.mid, GREEN.warn],
        textStyle: baseTextStyle(),
        tooltip: { trigger: "axis" },
        legend: { bottom: 0, textStyle: { color: GREEN.muted } },
        grid: { left: 40, right: 16, top: 24, bottom: 48 },
        xAxis: { type: "category", boundaryGap: false, data: labels, axisLabel: { color: GREEN.muted } },
        yAxis: { type: "value", minInterval: 1, splitLine: { lineStyle: { color: "#d1fae5" } }, axisLabel: { color: GREEN.muted } },
        series: [
          { name: "Form", type: "line", stack: "wf", areaStyle: { opacity: 0.35 }, smooth: true, showSymbol: false, data: form },
          { name: "Logo", type: "line", stack: "wf", areaStyle: { opacity: 0.35 }, smooth: true, showSymbol: false, data: logo },
          { name: "Welcome", type: "line", stack: "wf", areaStyle: { opacity: 0.25 }, smooth: true, showSymbol: false, data: welcome },
          { name: "Mark live", type: "line", stack: "wf", areaStyle: { opacity: 0.2 }, smooth: true, showSymbol: false, data: markLive },
        ],
      }, true);

      // 5) Bar — last 24h message mix (exec)
      const bot = data.daily?.bot_messages || {};
      ensureChart("chartDailyMix")?.setOption({
        color: [GREEN.primary],
        textStyle: baseTextStyle(),
        tooltip: { trigger: "axis" },
        grid: { left: 40, right: 16, top: 24, bottom: 32 },
        xAxis: {
          type: "category",
          data: ["FAQ气泡", "页脚", "寒暄", "欢迎", "表单"],
          axisLabel: { color: GREEN.muted },
        },
        yAxis: { type: "value", minInterval: 1, splitLine: { lineStyle: { color: "#d1fae5" } }, axisLabel: { color: GREEN.muted } },
        series: [{
          type: "bar",
          barWidth: 28,
          data: [bot.faq_bubbles || 0, bot.faq_footer || 0, bot.social || 0, bot.welcome || 0, bot.form || 0],
          itemStyle: {
            borderRadius: [8, 8, 0, 0],
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: GREEN.mint },
              { offset: 1, color: GREEN.primary },
            ]),
          },
          label: { show: true, position: "top", color: GREEN.muted },
        }],
      }, true);

      Object.values(charts).forEach(c => c && c.resize());
    }

    function render(data) {
      const snap = data.snapshot || {};
      const c = snap.counters || {};
      const d = snap.derived || {};
      const daily = data.daily || {};
      document.getElementById("meta").textContent =
        `生成于 ${data.generated_at || "—"} · metrics ${data.metrics_updated_at || "—"} · QA 窗口 ${data.window?.qa_days || 7} 天`;

      renderKpis(document.getElementById("ops-kpis"), [
        ["FAQ sessions", cTriple(c, "faq_reply_sessions").total],
        ["过去24h FAQ", cTriple(c, "faq_reply_sessions").today],
        ["表单成功", cTriple(c, "form_dispatch_success").total],
        ["Logo 成功", cTriple(c, "logo_fill_success").total],
        ["欢迎序列", cTriple(c, "welcome_sequences_started").total],
        ["Mark live", cTriple(c, "mark_live_triggers").total],
        ["Webhook 收/处", `${cTriple(c, "webhook_live_received").total}/${cTriple(c, "webhook_live_processed").total}`],

      document.getElementById("view-exec").classList.toggle("hidden", view !== "exec");
      setTimeout(() => Object.values(charts).forEach(c => c && c.resize()), 50);
    });

    window.addEventListener("resize", () => Object.values(charts).forEach(c => c && c.resize()));

    load();
    setInterval(load, 60 * 60 * 1000);
  </script>
</body>
</html>
