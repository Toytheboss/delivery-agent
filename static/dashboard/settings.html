<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Botchain Delivery · 设置</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dashboard/static/app.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div>
          <h1>Botchain Delivery</h1>
          <p>配置面板 · 安全项可热更新</p>
        </div>
      </div>
      <nav class="nav">
        <a href="#" id="link-data">数据</a>
        <a class="active" href="#" id="link-settings">设置</a>
        <button type="button" id="btn-logout">退出</button>
      </nav>
    </header>

    <div id="err" class="err hidden"></div>
    <div class="meta" id="meta">加载中…</div>

    <div class="actions">
      <button type="button" class="btn primary" id="btn-save">保存设置</button>
      <button type="button" class="btn" id="btn-reload-kb">重载知识库</button>
    </div>

    <div class="form-grid" id="settings-form"></div>

    <section class="panel" style="margin-top:16px">
      <h2>知识学习</h2>
      <div class="form-grid">
        <div class="field" style="grid-column: 1 / -1">
          <label>写入新知识</label>
          <textarea id="learn-content" placeholder="答案或知识点正文"></textarea>
          <input type="text" id="learn-q" placeholder="相关问题（可选）" style="margin-top:8px" />
          <label style="margin-top:8px;font-weight:500"><input type="checkbox" id="learn-lark" /> 同步飞书词条库</label>
          <div class="actions">
            <button type="button" class="btn primary" id="btn-learn">保存学习</button>
          </div>
        </div>
      </div>
      <div class="learned-list" id="learned-list"></div>
    </section>
  </div>
  <script>
    const base = location.pathname.replace(/\/$/, "").replace(/\/settings$/, "") || "/dashboard";
    document.querySelector('link[rel="stylesheet"]').href = `${base}/static/app.css`;
    document.getElementById("link-data").href = `${base}`;
    document.getElementById("link-settings").href = `${base}/settings`;
    document.getElementById("btn-logout").addEventListener("click", async () => {
      await fetch(`${base}/api/logout`, { method: "POST", credentials: "same-origin" });
      location.href = `${base}/login`;
    });

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    async function api(path, opts = {}) {
      const res = await fetch(`${base}${path}`, {
        credentials: "same-origin",
        ...opts,
        headers: {
          "Content-Type": "application/json",
          ...(opts.headers || {}),
        },
      });
      if (res.status === 401) { location.href = `${base}/login`; throw new Error("登录已过期"); }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function renderFields(fields) {
      const root = document.getElementById("settings-form");
      root.innerHTML = fields.map(f => {
        const id = `f-${f.key.replace(/[^a-zA-Z0-9]/g, "_")}`;
        if (f.type === "bool") {
          return `<div class="field bool" data-key="${esc(f.key)}" data-type="bool">
            <label for="${id}">${esc(f.label)}</label>
            <input id="${id}" type="checkbox" ${f.value ? "checked" : ""} />
          </div>`;
        }
        if (f.type === "str_list") {
          const val = Array.isArray(f.value) ? f.value.join("\n") : (f.value || "");
          return `<div class="field" data-key="${esc(f.key)}" data-type="str_list">
            <label for="${id}">${esc(f.label)}</label>
            <textarea id="${id}">${esc(val)}</textarea>
            <div class="hint">每行一项</div>
          </div>`;
        }
        return `<div class="field" data-key="${esc(f.key)}" data-type="${esc(f.type)}">
          <label for="${id}">${esc(f.label)}</label>
          <input id="${id}" type="${f.type === "int" || f.type === "float" ? "number" : "text"}" step="${f.type === "float" ? "0.01" : "1"}" value="${esc(f.value)}" />
        </div>`;
      }).join("");
    }

    function collectValues() {
      const values = {};
      document.querySelectorAll("#settings-form .field").forEach(el => {
        const key = el.dataset.key;
        const type = el.dataset.type;
        const input = el.querySelector("input, textarea, select");
        if (!input) return;
        if (type === "bool") values[key] = input.checked;
        else if (type === "str_list") values[key] = input.value;
        else if (type === "int") values[key] = parseInt(input.value, 10);
        else if (type === "float") values[key] = parseFloat(input.value);
        else values[key] = input.value;
      });
      return values;
    }

    function renderLearned(items) {
      const root = document.getElementById("learned-list");
      root.innerHTML = (items || []).map(it => `
        <div class="learned-item">
          <div class="name">${esc(it.name)} · ${esc(it.mtime)} · ${it.chars} chars</div>
          <div>${esc(it.preview)}</div>
          <div class="actions">
            <button type="button" class="btn" data-del="${esc(it.name)}">删除</button>
          </div>
        </div>`).join("") || `<div class="meta">暂无学习记录</div>`;
      root.querySelectorAll("[data-del]").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm(`删除 ${btn.dataset.del}？`)) return;
          try {
            await api(`/api/learned/${encodeURIComponent(btn.dataset.del)}`, { method: "DELETE" });
            await refreshLearned();
          } catch (e) {
            alert(e.message || e);
          }
        });
      });
    }

    async function refreshLearned() {
      const data = await api("/api/learned");
      renderLearned(data.items || []);
    }

    async function boot() {
      const err = document.getElementById("err");
      try {
        const data = await api("/api/settings");
        document.getElementById("meta").textContent = `overrides: ${data.overrides_path || "data/runtime_overrides.yaml"}`;
        renderFields(data.fields || []);
        await refreshLearned();
        err.classList.add("hidden");
      } catch (e) {
        err.textContent = `加载失败：${e.message || e}`;
        err.classList.remove("hidden");
      }
    }

    document.getElementById("btn-save").addEventListener("click", async () => {
      try {
        const res = await api("/api/settings", {
          method: "PUT",
          body: JSON.stringify({ values: collectValues() }),
        });
        alert(`已保存 ${ (res.applied || []).length } 项`);
        renderFields(res.settings?.fields || []);
      } catch (e) {
        alert(e.message || e);
      }
    });

    document.getElementById("btn-reload-kb").addEventListener("click", async () => {
      try {
        const res = await api("/api/knowledge/reload", { method: "POST", body: "{}" });
        alert(`知识库已重载：${res.chunks} chunks`);
      } catch (e) {
        alert(e.message || e);
      }
    });

    document.getElementById("btn-learn").addEventListener("click", async () => {
      try {
        await api("/api/learned", {
          method: "POST",
          body: JSON.stringify({
            content: document.getElementById("learn-content").value,
            related_question: document.getElementById("learn-q").value,
            sync_lark: document.getElementById("learn-lark").checked,
          }),
        });
        document.getElementById("learn-content").value = "";
        document.getElementById("learn-q").value = "";
        await refreshLearned();
        alert("已写入学习");
      } catch (e) {
        alert(e.message || e);
      }
    });

    boot();
  </script>
</body>
</html>
